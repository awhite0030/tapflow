name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  pull_request:

env:
  IMAGE: tapflow/tapflow

jobs:
  # Build each architecture on its own native runner. arm64 used to build under
  # QEMU emulation on an amd64 runner, where the native module compile could hang
  # for hours; native runners remove the emulation entirely.
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn when Docker Hub credentials are missing
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB != 'true'
        run: echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set — building the image for validation but skipping push."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build image (push by digest when publishing)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          # Publish: push a per-architecture image by digest (merged into a manifest
          # list in the merge job). Otherwise (PR / no credentials): load the
          # built image into Docker so the runtime smoke test exercises it.
          outputs: ${{ (github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true') && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || format('type=docker,name=tapflow-smoke:{0}', env.PLATFORM_PAIR) }}

      - name: Select image for smoke test
        run: |
          if [ "${HAS_DOCKERHUB}" = "true" ] && [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "SMOKE_IMAGE=${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"
          else
            echo "SMOKE_IMAGE=tapflow-smoke:${PLATFORM_PAIR}" >> "$GITHUB_ENV"
          fi

      - name: Smoke test image runtime
        timeout-minutes: 5
        run: |
          set -euo pipefail

          container="tapflow-smoke-${PLATFORM_PAIR}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="${container}-data"
          root_body="${RUNNER_TEMP}/tapflow-smoke-root.txt"
          api_body="${RUNNER_TEMP}/tapflow-smoke-auth-status.txt"

          diagnose_container() {
            if docker inspect "$container" >/dev/null 2>&1; then
              docker inspect -f 'Container exists: true
          State.Status={{.State.Status}}
          State.ExitCode={{.State.ExitCode}}
          State.OOMKilled={{.State.OOMKilled}}' "$container" 2>/dev/null || true
            else
              echo "Container exists: false"
            fi
          }

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Smoke container diagnostics:" >&2
              diagnose_container >&2
              docker logs --tail 50 "$container" || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          start_container() {
            docker run -d \
              --name "$container" \
              -p 127.0.0.1:4000:4000 \
              -v "$volume:/app/.tapflow/data" \
              "$SMOKE_IMAGE" >/dev/null
          }

          wait_for_ready() {
            phase="$1"
            for attempt in $(seq 1 20); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != "true" ]; then
                echo "Container exited before readiness during ${phase} (attempt ${attempt})." >&2
                return 1
              fi

              root_status="$(curl --connect-timeout 2 --max-time 2 -sS -o "$root_body" -w '%{http_code}' http://127.0.0.1:4000/ || true)"
              api_status="$(curl --connect-timeout 2 --max-time 2 -sS -o "$api_body" -w '%{http_code}' http://127.0.0.1:4000/api/v1/auth/status || true)"
              if [ "$root_status" -ge 200 ] && [ "$root_status" -lt 400 ] \
                && [ "$api_status" -ge 200 ] && [ "$api_status" -lt 400 ] \
                && grep -Fq '<title>tapflow</title>' "$root_body" \
                && grep -Eq '"initialized":(true|false)' "$api_body"; then
                echo "Smoke test ${phase} passed with HTTP /=${root_status} and /api/v1/auth/status=${api_status}."
                return 0
              fi

              sleep 2
            done

            echo "Relay did not return the expected HTTP responses on :4000 during ${phase}." >&2
            echo "Last observed HTTP statuses: /=${root_status:-none}, /api/v1/auth/status=${api_status:-none}." >&2
            return 1
          }

          jwt_secret_fingerprint() {
            docker exec "$container" sh -eu -c \
              'if [ ! -s /app/.tapflow/data/jwt-secret ]; then
                echo "JWT secret file is missing or empty." >&2
                exit 1
              fi
              sha256sum /app/.tapflow/data/jwt-secret | cut -d " " -f1'
          }

          docker volume create "$volume" >/dev/null
          start_container
          wait_for_ready "first boot"

          node <<'NODE'
          const http = require('http')
          const crypto = require('crypto')

          const expectedCode = 1008
          const timeoutMs = 5000
          let done = false
          let upgraded = false
          let request = null
          let socket = null
          let buffer = Buffer.alloc(0)

          const finish = (ok, message) => {
            if (done) return
            done = true
            clearTimeout(timer)
            if (request) request.destroy()
            if (socket) socket.destroy()
            if (ok) {
              console.log('WebSocket smoke probe passed: upgrade status=101 and close code=1008.')
              process.exit(0)
            }
            console.error(`WebSocket smoke probe failed: ${message}`)
            process.exit(1)
          }

          const consume = (chunk) => {
            if (done) return
            if (chunk && chunk.length > 0) buffer = Buffer.concat([buffer, chunk])
            if (buffer.length < 2) return

            const opcode = buffer[0] & 0x0f
            if (opcode !== 0x8) return finish(false, `expected first WebSocket frame opcode 0x8 (close) but got 0x${opcode.toString(16)}`)

            const b1 = buffer[1]
            const payloadLength = b1 & 0x7f
            if ((b1 & 0x80) !== 0) return finish(false, 'unexpected masked server close frame')
            if (payloadLength > 125) return finish(false, `close frame payload length ${payloadLength} is invalid for a control frame`)
            if (buffer.length < 2 + payloadLength) return
            if (payloadLength < 2) return finish(false, 'close frame missing close code payload')

            const closeCode = buffer.readUInt16BE(2)
            if (closeCode !== expectedCode) return finish(false, `expected close code ${expectedCode} but got ${closeCode}`)
            finish(true)
          }

          const timer = setTimeout(() => {
            if (!upgraded) return finish(false, `timed out after ${timeoutMs}ms waiting for HTTP 101 upgrade`)
            finish(false, `timed out after ${timeoutMs}ms waiting for WebSocket close frame with code ${expectedCode}`)
          }, timeoutMs)

          request = http.request('http://127.0.0.1:4000/', {
            headers: {
              Connection: 'Upgrade',
              Upgrade: 'websocket',
              'Sec-WebSocket-Version': '13',
              'Sec-WebSocket-Key': crypto.randomBytes(16).toString('base64'),
            },
          })

          request.on('response', (res) => {
            finish(false, `expected HTTP 101 upgrade but got HTTP ${res.statusCode ?? 'unknown'}`)
          })

          request.on('upgrade', (res, upgradedSocket, head) => {
            if (res.statusCode !== 101) {
              finish(false, `expected HTTP 101 upgrade but got HTTP ${res.statusCode ?? 'unknown'}`)
              return
            }
            upgraded = true

            socket = upgradedSocket
            socket.on('data', consume)
            socket.on('end', () => {
              finish(false, 'connection ended before receiving the expected WebSocket close frame')
            })
            socket.on('close', () => {
              finish(false, 'connection closed before receiving the expected WebSocket close frame')
            })
            socket.on('error', (error) => {
              finish(false, `connection/upgrade failed: ${error.message}`)
            })

            consume(head)
          })

          request.on('error', (error) => {
            finish(false, `connection/upgrade failed: ${error.message}`)
          })

          request.end()
          NODE

          first_jwt_secret="$(jwt_secret_fingerprint)"

          docker rm -f "$container" >/dev/null
          start_container
          wait_for_ready "restart"
          second_jwt_secret="$(jwt_secret_fingerprint)"

          if [ "$first_jwt_secret" != "$second_jwt_secret" ]; then
            echo "JWT secret did not persist across container recreation." >&2
            exit 1
          fi
          echo "JWT secret persisted across container recreation."

      - name: Export digest
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-architecture digests into a single multi-arch manifest list.
  # Only runs for real publishes; PRs and credential-less builds validate only.
  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - name: Note validation-only build
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "::warning::No Docker Hub credentials — per-architecture validation builds succeeded, nothing to publish."

      - name: Download digests
        if: env.HAS_DOCKERHUB == 'true'
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create manifest list and push
        if: env.HAS_DOCKERHUB == 'true'
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # intentional split: expand -t flags and per-digest refs
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        if: env.HAS_DOCKERHUB == 'true'
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
